<!doctype html>
<html lang="en" translate="no">
  <meta name="google" content="notranslate" />
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/assets/button/guitar-9546520_640.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="css/root.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/game-over.css" />
    <link rel="stylesheet" href="css/how-toplay.css" />
    <link rel="stylesheet" href="css/highscore-screen.css" />
    <link rel="stylesheet" href="css/carousel.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/overlay.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/impressum-data.css" />
    <link rel="stylesheet" href="css/win.css" />
    <link rel="stylesheet" href="css/taco-time-overlay.css" />
    <link rel="stylesheet" href="css/shared-responsive.css" />
    <link rel="stylesheet" href="css/shared-components.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/settings-modern.css" />
    <link rel="stylesheet" href="css/responsive-tablet.css" />
    <link rel="stylesheet" href="css/responsive-mobile.css" />
    <link rel="stylesheet" href="css/responsive-desktop.css" />
    <link rel="stylesheet" href="css/pause-disabled.css" />
    <title>El Pollo Loco- Chicken Tabasco</title>
  </head>

  <body onload="init()">
    <audio id="index-sound" src="/assets/audio/guitarre.mp3"></audio>
    <header id="start-header">
      <button
        type="button"
        id="impressum-link"
        class="header-btn"
        onclick="showPageDiv('impressum')"
      >
        Impressum
      </button>
      <nav id="start-navbar">
        <button
          type="button"
          id="revolver-btn"
          class="header-btn"
          aria-controls="menu-overlay"
          aria-expanded="false"
          onclick="window.showMainMenuOverlay()"
        >
          <img
            src="/assets/img/10_external_img/revolver-menu.png"
            alt="menu"
            class="nav-icon"
          />
        </button>
      </nav>
      <button
        type="button"
        id="datenschutz-link"
        class="header-btn"
        onclick="showPageDiv('datenschutz')"
      >
        Datenschutz
      </button>
    </header>
    <main>
      <section id="game-container">
        <div id="fullscreen">
          <h1>El Pollo Loco - Chicken Tabasco</h1>
          <div
            id="countdown-revolver-wrapper"
            style="position: relative; width: 720px; margin: 0 auto"
          >
            <img
              id="countdown-revolver-img"
              src="assets/img/10_external_img/revolver-menu.png"
              alt="Revolver"
              style="
                position: absolute;
                left: 50%;
                top: 55%;
                transform: translate(-50%, 0);
                width: 380px;
                max-width: 75%;
                display: none;
                z-index: 2;
                pointer-events: none;
              "
            />
            <canvas id="canvas" width="720" height="480"></canvas>
            <div
              id="tacoTimeOverlay"
              class="taco-time-overlay hide"
              style="display: none"
            ></div>
          </div>
          <div
            id="canvasFullscreenBtn"
            class="canvas-fullscreen-btn hidden"
            style="z-index: var(--z-index-overlay)"
          >
            <div id="rightButtons" class="mobile-buttons">
              <button id="canvasFullscreenButton" class="img-btn">
                <img
                  src="/assets/button/btn-small.png"
                  alt="Fullscreen"
                  class="small-img-height"
                />
                <span class="btn-text">Fulls.</span>
              </button>
              <!-- TacoTimeOverlay ist jetzt im revolver-wrapper, nicht mehr hier -->
              <button
                id="backButton"
                class="img-btn"
                onclick="showPageDiv('start-screen')"
              >
                <img
                  src="/assets/button/back-btn.png"
                  alt="back"
                  class="small-img-height"
                />
                <span class="btn-text">Back</span>
              </button>
              <button id="pauseButton" class="img-btn">
                <img
                  src="/assets/button/cowboy-1297120_640.png"
                  alt="pause"
                  class="small-img-height"
                />
                <span class="btn-text">Pause</span>
              </button>
              <button
                id="muteButton"
                class="img-btn"
                onclick="toggleMuteInLocalStorage()"
              >
                <img
                  src="/assets/button/mute.png"
                  alt="mute"
                  class="small-img-height"
                />
                <span class="btn-text" id="muteBtnLabel">Mute</span>
              </button>
            </div>
          </div>
          <div
            id="mobileButtonsBar"
            class="mobile-buttons-bar hidden"
            style="z-index: var(--z-index-modal)"
          >
            <div id="leftButtons" class="mobile-buttons">
              <button id="leftButton" class="img-btn">
                <img
                  src="/assets/button/arrow-left.png"
                  alt="left"
                  class="small-img-height"
                />
              </button>
              <button id="rightButton" class="img-btn">
                <img
                  src="/assets/button/arrow-right.png"
                  alt="right"
                  class="small-img-height"
                />
              </button>
            </div>
            <div id="middleButtons" class="mobile-buttons">
              <button id="jumpButton" class="img-btn">
                <img
                  src="/assets/button/boot-306065_640.png"
                  alt="jump"
                  class="small-img-height"
                />
              </button>
              <button id="throwButton" class="img-btn">
                <img
                  src="/assets/button/bow-and-arrow-7846362_640.png"
                  alt="throw"
                  class="small-img-height"
                />
              </button>
            </div>
          </div>
        </div>
      </section>

      <div id="extrascreens" class="extrascreens hidden" style="display: none">
        <div id="rotateScreen" class="rotate-screen hidden">
          <div
            style="display: flex; flex-direction: column; align-items: center"
          >
            <h1 style="margin-bottom: 10px">GAME PAUSED</h1>
            <p style="margin-top: 0">
              🔄️📱 Please rotate your phone to landscape mode!📱🔄️
            </p>
          </div>
        </div>
      </div>
    </main>
    <div id="main-menu-overlay" class="menu-overlay overlay-hidden">
      <div class="menu-overlay-backdrop"></div>
      <div id="div-main-menu"></div>
    </div>
    <section id="page-divs">
      <div id="div-datenschutz" style="display: none"></div>
      <div id="div-game-over" style="display: none"></div>
      <div id="div-highscore" style="display: none"></div>
      <div id="div-start-screen" style="display: none"></div>
      <div id="div-settings" style="display: none"></div>
      <div id="div-impressum" style="display: none"></div>
      <div id="div-how-to-play" style="display: none"></div>
      <div id="div-win" style="display: none"></div>
    </section>
    <script src="js/div-visibility-manager.js"></script>
    <script src="js/div-visibility-manager-part2.js"></script>
    <script src="js/interval-helper.js"></script>
    <script src="js/interval-helper-part2.js"></script>
    <script src="js/game-animation-utils.js"></script>
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/collectible-object.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/character-animation.js"></script>
    <script src="models/character-movement.js"></script>
    <script src="models/character-status.js"></script>
    <script src="models/character-actions.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/chicken-small.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/endboss-effect.class.js"></script>
    <script src="models/golden-egg.class.js"></script>
    <script src="models/endboss-animation.js"></script>
    <script src="models/endboss-movement.js"></script>
    <script src="models/endboss-collision.js"></script>
    <script src="models/endboss-audio.js"></script>
    <script src="models/endboss-ui.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/world-level.js"></script>
    <script src="models/world-collision.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/world-audio.js"></script>
    <script src="models/world-input.js"></script>
    <script src="models/world-ui.js"></script>
    <script src="models/world-loop.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/fullscreen.js"></script>
    <script src="js/extra-screens.js"></script>
    <script src="js/game.js"></script>
    <script src="js/game-part2.js"></script>
    <script src="js/open-page.js"></script>
  </body>
</html>
