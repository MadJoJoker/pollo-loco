        "game-over.html",
        "win.html",
        "impressum.html",
        "datenschutz.html",
        "settings.html",
        "highscore.html",
        "how-to-play.html",
      ];
      const hasValidReferrer = allowedReferrers.some((page) =>
        document.referrer.includes(page)
      );
      if (!hasValidReferrer) {
        window.location.href = "pages/start-screen.html";
      }

              <span class="taco-time-text">TACO TIME</span>
              <img
                src="assets/img/6_salsa_bottle/bottle_rotation/1_bottle_rotation.png"
                class="taco-time-icon"
                alt="Bottle"
              />
              <img

                class="taco-time-icon"
                alt="Bottle"
              />
              <img

        </div>
      </div>
      <div

        style="z-index: 101"
      >

    <!-- SCRIPTS AM SEITENENDE FÜR KORREKTE LADE-REIHENFOLGE -->

    <script src="models/chicken.class.js"></script>

    <script src="models/bottle.class.js"></script>

    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>

    <script src="levels/level1.js"></script>

    <script src="js/extra-screens.js"></script>
    <script src="js/game.js"></script>
    <!-- <script src="js/start-restart-init.js"></script> -->
    <script>
      /**
       * Zeigt das End-Overlay und lädt dynamisch den Inhalt von win.html oder game-over.html inkl. CSS/JS.
       * @param {string} pageUrl - URL der Endseite ("pages/win.html" oder "pages/game-over.html")
       */
      async function showEndOverlay(pageUrl) {
        // Spiel und Audios pausieren
        if (typeof window.pauseGame === "function") window.pauseGame();
        // Alle Audios stoppen
        document.querySelectorAll("audio").forEach((a) => {
          try {
            a.pause();
          } catch (e) {}
        });
        // Overlay-Elemente holen
        const bg = document.getElementById("end-overlay-bg");
        const content = document.getElementById("end-overlay-content");
        // Vorherigen Inhalt entfernen
        content.innerHTML = "";
        // Anzeigen
        bg.style.display = "block";
        content.style.display = "block";
        // Seite laden
        const resp = await fetch(pageUrl);
        let html = await resp.text();
        // Nur <body>-Inhalt extrahieren
        const bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        const bodyHtml = bodyMatch ? bodyMatch[1] : html;
        // CSS/JS extrahieren
        const cssLinks = [
          ...html.matchAll(/<link[^>]+href=["']([^"']+\.css)["'][^>]*>/gi),
        ].map((m) => m[1]);
        const jsLinks = [
          ...html.matchAll(
            /<script[^>]+src=["']([^"']+\.js)["'][^>]*><\/script>/gi
          ),
        ].map((m) => m[1]);
        // CSS einbinden (frisch)
        cssLinks.forEach((href) => {
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href + "?t=" + Date.now();
          link.classList.add("end-overlay-css");
          document.head.appendChild(link);
        });
        // Inhalt einfügen
        content.innerHTML = bodyHtml;
        // JS einbinden (frisch)
        jsLinks.forEach((src) => {
          const script = document.createElement("script");
          script.src = src + "?t=" + Date.now();
          script.classList.add("end-overlay-js");
          document.body.appendChild(script);
        });
        // Schließen-Logik: Klick auf Hintergrund schließt Overlay
        bg.onclick = () => hideEndOverlay();
        // Restart-Button animiert einblenden, falls vorhanden
        const restartBtn = content.querySelector(
          "#restartButton, .restart-btn, [data-restart]"
        );
        if (restartBtn) {
          restartBtn.style.opacity = 0;
          restartBtn.style.transition = "opacity 0.7s";
          setTimeout(() => (restartBtn.style.opacity = 1), 500);
          restartBtn.onclick = (e) => {
            e.stopPropagation();
            hideEndOverlay();
            if (typeof restartGame === "function") restartGame();
          };
        }
      }

      function hideEndOverlay() {
        // Overlay ausblenden
        document.getElementById("end-overlay-bg").style.display = "none";
        document.getElementById("end-overlay-content").style.display = "none";
        // Dynamisch eingebundene CSS/JS entfernen
        document
          .querySelectorAll(".end-overlay-css")
          .forEach((e) => e.remove());
        document.querySelectorAll(".end-overlay-js").forEach((e) => e.remove());
        // Inhalt löschen
        document.getElementById("end-overlay-content").innerHTML = "";
      }
    </script>
  </body>
</html>
