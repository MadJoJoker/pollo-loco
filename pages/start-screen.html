<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chicken-Tabasco</title>
    <link rel="shortcut icon" href="/assets/button/guitar-9546520_640.png" type="image/x-icon">

    <link rel="stylesheet" href="/css/start-screen.css" />
  </head>
  <body id="start-body">
    <header id="start-header">
       <a onclick="location.href='/pages/impressum.html'">Impressum</a>
      <nav id="start-navbar">
        <div id="main-menu-placeholder">    </div>


      </nav>
      <a onclick="location.href='/pages/datenschutz.html'">Datenschutz</a>
    </header>
    <div id="scoreboard">
      <h1>Start Game</h1>
      <button id="start-game-btn-scoreboard" onclick="location.href='/index.html'">

        <img
          src="/assets/button/hat-310509_640.png"
          alt="scoreboard"
          style="height: 64px"
        />
      </button>
    </div>
    <script>
      fetch("/pages/main-menu.html")
        .then((response) => response.text())
        .then((html) => {
          document.getElementById("main-menu-placeholder").innerHTML = html;
          if (window.initCarousel) window.initCarousel();
        });
    </script>
    <script src="/js/main-menu-carousel.js"></script>
  </body>
</html>
