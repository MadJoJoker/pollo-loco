<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Over</title>
    <link rel="stylesheet" href="/css/root.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/navigation.css" />
    <link rel="stylesheet" href="/css/carousel.css" />
    <link rel="stylesheet" href="/css/overlay.css" />
    <link rel="stylesheet" href="/css/animations.css" />
    <link rel="stylesheet" href="/css/game-over.css" />
    <link rel="stylesheet" href="/css/responsive-tablet.css" />
    <link rel="stylesheet" href="/css/responsive-mobile.css" />
    <link rel="stylesheet" href="/css/responsive-desktop.css" />
    <link
      rel="shortcut icon"
      href="/assets/button/guitar-9546520_640.png"
      type="image/x-icon"
    />
  </head>
  <body id="start-body">
    <audio
      id="game-over-sound"
      src="/assets/audio/game-over.mp3"
      autoplay
      loop
    ></audio>

    <div id="scoreboard-gameover">
      <h1>
        Try Again?
        <div class="button-container">
          <a id="restart-btn" href="../index.html" class="img-btn">
            <img src="/assets/button/check-btn.png" alt="restart" />
          </a>
          <img
            id="no-restart-btn"
            src="/assets/button/close-btn.png"
            alt="no-restart"
          />
        </div>
      </h1>
      <div id="game-over-msg"></div>
      <div id="no-restart-overlay" class="overlay-hidden">
        Give up is no option. Try again.
      </div>
    </div>

    <script src="/js/interval-helper.js"></script>
    <script src="/js/main-menu-carousel.js"></script>
    <script src="/js/overlay-menu.js"></script>
  </body>
</html>
