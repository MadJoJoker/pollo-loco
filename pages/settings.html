<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link
      rel="shortcut icon"
      href="/assets/button/guitar-9546520_640.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="/css/root.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/navigation.css" />
    <link rel="stylesheet" href="/css/carousel.css" />
    <link rel="stylesheet" href="/css/overlay.css" />
    <link rel="stylesheet" href="/css/animations.css" />
    <link rel="stylesheet" href="/css/settings.css" />
    <link rel="stylesheet" href="/css/settings-modern.css" />
    <link rel="stylesheet" href="/css/responsive-tablet.css" />
    <link rel="stylesheet" href="/css/responsive-mobile.css" />
    <link rel="stylesheet" href="/css/responsive-desktop.css" />
  </head>
  <body id="settings-body">
    <audio id="settings-sound" src="/assets/audio/waiting-music.mp3"></audio>

    <div id="settings-scoreboard">
      <h1>Settings</h1>
      <div id="mute-control">
        <label for="mute-range">Sound:</label>
        <input
          type="range"
          id="mute-range"
          min="0"
          max="1"
          step="1"
          data-mute="0"
        />
        <span id="mute-status">
          Sound on
          <img id="mute-icon" src="/assets/button/mute.png" alt="mute" />
        </span>
      </div>
      <script>
        (function () {
          const muteRangeInit = document.getElementById("mute-range");
          if (muteRangeInit) {
            const storedMute = localStorage.getItem("polloMute");
            if (storedMute === "1" || storedMute === "0") {
              muteRangeInit.value = storedMute;
            }
          }
          const muteRange = document.getElementById("mute-range");
          const muteStatus = document.getElementById("mute-status");
          const muteIcon = document.getElementById("mute-icon");
          if (muteRange) {
            muteRange.addEventListener("input", function () {
              if (muteRange.value == "1") {
                muteStatus.childNodes[0].textContent = "Sound off";
                muteIcon.src = "/assets/button/mute.png";
                muteRange.setAttribute("data-mute", "1");
                localStorage.setItem("polloMute", "1");
              } else {
                muteStatus.childNodes[0].textContent = "Sound on";
                muteIcon.src = "/assets/img/10_external_img/sound-on.png";
                muteRange.setAttribute("data-mute", "0");
                localStorage.setItem("polloMute", "0");
              }
              if (window.updatePageAudios) {
                const visibleDiv = Array.from(
                  document.querySelectorAll('div[id^="div-"]'),
                ).find((div) => div.style.display === "block");
                if (visibleDiv) window.updatePageAudios(visibleDiv.id);
              }
            });
          }
        })();
      </script>
    </div>

    <div id="page-main"></div>

    <script src="/js/interval-helper.js"></script>
    <script src="/js/main-menu-carousel.js"></script>

    <script src="/js/overlay-menu.js"></script>
  </body>
</html>
