  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chicken-Tabasco</title>
  <link rel="shortcut icon" href="/assets/img/2_character_pepe/1_idle/long_idle/I-14.png" type="image/x-icon">
<link rel="stylesheet" href="/css/settings.css">
</head>
<body id="settings-body">
  <header id="settings-header">
   <nav id="settings"></nav>
   </header>
<div id="settings-scoreboard">
  <h1>Settings</h1>
<div id="mute-control" style="margin: 24px 0;">
  <label for="mute-range">Mute:</label>
  <input type="range" id="mute-range" min="0" max="1" step="1" value="0">
  <span id="mute-status">Sound an</span>
</div>
<script>
  const muteRange = document.getElementById('mute-range');
  const muteStatus = document.getElementById('mute-status');

  muteRange.addEventListener('input', function() {
    if (muteRange.value == "1") {
      muteStatus.textContent = "Sound aus";
    } else {
      muteStatus.textContent = "Sound an";
    }
  });
</script>
  </div>
</div>

   <section id="settings-main">
    <div id="settings-game">
      <button id="settings-game-btn">El Startos</button>
    </div>
    <div id="settings">
      <button id="settings-btn">La Rulos</button>
    </div>
    <div id="settings">
      <button id="settings-btn">Technoligia</button>
    </div>
    <div id="highscore">
      <button id="highscore-btn">El Muchatcho</button>
    </div>

   </section>


</body>
</html>
