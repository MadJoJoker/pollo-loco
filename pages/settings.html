<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link
      rel="shortcut icon"
      href="/assets/button/guitar-9546520_640.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="/css/root.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/navigation.css" />
    <link rel="stylesheet" href="/css/carousel.css" />
    <link rel="stylesheet" href="/css/overlay.css" />
    <link rel="stylesheet" href="/css/animations.css" />
    <link rel="stylesheet" href="/css/settings.css" />
    <link rel="stylesheet" href="/css/settings-modern.css" />
    <link rel="stylesheet" href="/css/responsive-tablet.css" />
    <link rel="stylesheet" href="/css/responsive-mobile.css" />
    <link rel="stylesheet" href="/css/responsive-desktop.css" />
  </head>
  <body id="settings-body">
    <audio
      id="settings-sound"
      src="/assets/audio/waiting-music.mp3"
      autoplay
      loop
    ></audio>

    <div id="settings-scoreboard">
      <h1>Settings</h1>
      <div id="mute-control">
        <label for="mute-range">Sound:</label>
        <input
          type="range"
          id="mute-range"
          min="0"
          max="1"
          step="1"
          value="0"
          data-mute="0"
        />
        <span id="mute-status">
          Sound on
          <img id="mute-icon" src="/assets/button/mute.png" alt="mute" />
        </span>
      </div>
      <script>
        (function () {
          const muteRange = document.getElementById("mute-range");
          const muteStatus = document.getElementById("mute-status");
          const muteIcon = document.getElementById("mute-icon");
          if (muteRange) {
            muteRange.addEventListener("input", function () {
              if (muteRange.value == "1") {
                muteStatus.childNodes[0].textContent = "Sound off";
                muteIcon.src = "/assets/button/mute.png";
                muteRange.setAttribute("data-mute", "1");
              } else {
                muteStatus.childNodes[0].textContent = "Sound on";
                muteIcon.src = "/assets/img/10_external_img/sound-on.png";
                muteRange.setAttribute("data-mute", "0");
              }
            });
          }
        })();
      </script>
    </div>

    <header id="start-header">
      <a href="impressum.html" data-link="impressum.html">Impressum</a>
      <nav id="start-navbar">
        <a
          id="revolver-btn"
          href="#"
          aria-controls="menu-overlay"
          aria-expanded="false"
        >
          <img
            src="/assets/img/10_external_img/revolver-menu.png"
            alt="menu"
            class="nav-icon"
          />
        </a>
      </nav>
      <a href="datenschutz.html" data-link="datenschutz.html">Datenschutz</a>
    </header>

    <div id="page-main"></div>

    <div
      id="menu-overlay"
      class="menu-overlay overlay-hidden"
      aria-hidden="true"
    >
      <div class="menu-overlay-backdrop" id="menu-backdrop"></div>
      <div
        class="menu-drawer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="menu-title"
      >
        <button id="close-menu" class="close-menu" aria-label="Close menu">
          ✕
        </button>
        <h2 id="menu-title" class="visually-hidden">Main Menu</h2>
        <div id="overlay-carousel-container"></div>
      </div>
    </div>

    <script src="/js/interval-helper.js"></script>
    <script src="/js/main-menu-carousel.js"></script>

    <script src="/js/overlay-menu.js"></script>
  </body>
</html>
