<div
  id="name-overlay"
  style="
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.7);
    z-index: var(--z-index-modal);
    justify-content: center;
    align-items: center;
  "
>
  <div
    style="
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      min-width: 300px;
      text-align: center;
    "
  >
    <h1>New Highscore!</h1>
    <h2>Please type your name</h2>
    <input
      type="text"
      id="player-name"
      placeholder="Your Name"
      style="width: 80%; padding: 0.5rem; margin-bottom: 1rem"
    />
    <br />
    <button onclick="submitName()">
      <img src="/assets/button/check-btn.png" alt="OK" style="height: 32px" />
    </button>
    <button onclick="closeNameOverlay()" style="margin-left: 1rem">
      <img
        src="/assets/button/close-btn.png"
        alt="Cancel"
        style="height: 32px"
      />
    </button>
  </div>
</div>

<!-- Overlay Placeholder for menu -->
<div id="menu-overlay" class="menu-overlay overlay-hidden" aria-hidden="true">
  <div class="menu-overlay-backdrop" id="menu-backdrop"></div>
  <div
    class="menu-drawer"
    role="dialog"
    aria-modal="true"
    aria-labelledby="menu-title"
  >
    <button id="close-menu" class="close-menu" aria-label="Close menu">
      ✕
    </button>
    <h2 id="menu-title" class="visually-hidden">Main Menu</h2>
    <div id="overlay-carousel-container"></div>
  </div>
</div>
