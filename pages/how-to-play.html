<head>
  <meta charset="UTF-8">

  <title>How to Play</title>
  <link rel="stylesheet" href="/css/how-toplay.css">

  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chicken-Tabasco</title>
  <link rel="shortcut icon" href="/assets/img/2_character_pepe/1_idle/long_idle/I-14.png" type="image/x-icon">
<link rel="stylesheet" href="/css/start-screen.css">
</head>
<body id="start-body">
  <header id="start-header">
   <nav id="start-navbar"></nav>
   </header>
<div id="how-to-play-scoreboard">
  <h1>How to Play</h1>
  <div class="scoreboard-columns">
    <ul>
      <li>Left: <img src="/assets/button/arrow-left.png" alt="Left Control"></li>
      <li>Right: <img src="/assets/button/arrow-right.png" alt="Right Control"></li>
      <li>Throw: <img src="/assets/button/bow-and-arrow-7846362_640.png" alt="Throw Control"></li>
      <li>Jump: <img src="/assets/button/boot-306065_640.png" alt="Jump Control"></li>
    </ul>
    <ul>
      <li>Mute: <img src="/assets/button/mute.png" alt="Mute Control"></li>
      <li>Pause: <img src="/assets/button/cowboy-1297120_640.png" alt="Pause Control"></li>
      <li>Start Game: <img src="/assets/button/hat-310509_640.png" alt="Start Game Control"></li>
      <li>Fullscreen: <img src="/assets/button/btn-small.png" alt="Fullscreen Control"></li>
    </ul>
  </div>
</div>

   <section id="how-to-play-main">
    <div id="how-to-play-game">
      <button id="how-to-play-game-btn">El Startos</button>
    </div>
    <div id="how-to-play">
      <button id="how-to-play-btn">La Rulos</button>
    </div>
    <div id="settings">
      <button id="settings-btn">Technoligia</button>
    </div>
    <div id="highscore">
      <button id="highscore-btn">El Muchatcho</button>
    </div>

   </section>


</body>
</html>
