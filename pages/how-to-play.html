<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How to Play</title>
    <link rel="stylesheet" href="/css/root.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/navigation.css" />
    <link rel="stylesheet" href="/css/carousel.css" />
    <link rel="stylesheet" href="/css/overlay.css" />
    <link rel="stylesheet" href="/css/animations.css" />
    <link rel="stylesheet" href="/css/how-toplay.css" />
    <link rel="stylesheet" href="/css/responsive-tablet.css" />
    <link rel="stylesheet" href="/css/responsive-mobile.css" />
    <link rel="stylesheet" href="/css/responsive-desktop.css" />

    <link
      rel="shortcut icon"
      href="/assets/button/guitar-9546520_640.png"
      type="image/x-icon"
    />
  </head>
  <body id="start-body">
    <audio
      id="how-to-play-sound"
      src="/assets/audio/how-to-play.mp3"
      autoplay
      loop
    ></audio>

    <div id="how-to-play-scoreboard">
      <h1>How to Play</h1>
      <div class="scoreboard-columns">
        <ul>
          <li>
            Left . . . ⬅️<img
              src="/assets/button/arrow-left.png"
              alt="Left Control"
            />
          </li>
          <li>
            Right . . . ➡️<img
              src="/assets/button/arrow-right.png"
              alt="Right Control"
            />
          </li>
          <li>
            Throw . . . D<img
              src="/assets/button/bow-and-arrow-7846362_640.png"
              alt="Throw Control"
            />
          </li>
          <li>
            Jump . . . Space<img
              src="/assets/button/boot-306065_640.png"
              alt="Jump Control"
            />
          </li>
        </ul>
        <ul>
          <li>
            Mute . . .<img src="/assets/button/mute.png" alt="Mute Control" />
          </li>
          <li>
            Pause . . .<img
              src="/assets/button/cowboy-1297120_640.png"
              alt="Pause Control"
            />
          </li>
          <li>
            Start . . .<img
              src="/assets/button/hat-310509_640.png"
              alt="Start Game Control"
            />
          </li>
          <li>
            Fullsrn . . .<img
              src="/assets/button/btn-small.png"
              alt="Fullscreen Control"
            />
          </li>
        </ul>
      </div>
    </div>

    <header id="start-header">
      <a href="impressum.html" data-link="impressum.html">Impressum</a>
      <nav id="start-navbar">
        <a
          id="revolver-btn"
          href="#"
          aria-controls="menu-overlay"
          aria-expanded="false"
        >
          <img
            src="/assets/img/10_external_img/revolver-menu.png"
            alt="menu"
            class="nav-icon"
          />
        </a>
      </nav>
      <a href="datenschutz.html" data-link="datenschutz.html">Datenschutz</a>
    </header>

    <div id="page-main"></div>

    <div
      id="menu-overlay"
      class="menu-overlay overlay-hidden"
      aria-hidden="true"
    >
      <div class="menu-overlay-backdrop" id="menu-backdrop"></div>
      <div
        class="menu-drawer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="menu-title"
      >
        <button id="close-menu" class="close-menu" aria-label="Close menu">
          ✕
        </button>
        <h2 id="menu-title" class="visually-hidden">Main Menu</h2>
        <div id="overlay-carousel-container"></div>
      </div>
    </div>

    <script>
      function loadCarousel() {
        fetch("main-menu.html")
          .then((response) => response.text())
          .then((html) => {
            const container = document.getElementById(
              "overlay-carousel-container"
            );
            if (container) container.innerHTML = html;
            if (window.initCarousel) window.initCarousel();
          })
          .catch((err) => {
            console.error("Failed to load main-menu.html", err);
          });
      }

      document.addEventListener("DOMContentLoaded", loadCarousel);
      document.addEventListener("spa:render", loadCarousel);
    </script>
    <script src="/js/interval-helper.js"></script>
    <script src="/js/main-menu-carousel.js"></script>

    <script>
      (function () {
        const revolver = document.getElementById("revolver-btn");
        const overlay = document.getElementById("menu-overlay");
        const backdrop = document.getElementById("menu-backdrop");
        const closeBtn = document.getElementById("close-menu");
        const pageMain = document.getElementById("page-main");

        function setInert(state) {
          if ("inert" in HTMLElement.prototype) {
            if (pageMain) pageMain.inert = state;
            return;
          }
          if (!pageMain) return;
          const focusables = pageMain.querySelectorAll(
            "a[href], button, textarea, input, select, [tabindex]"
          );
          focusables.forEach((el) => {
            if (state) {
              if (el.hasAttribute("tabindex"))
                el.setAttribute(
                  "data-old-tabindex",
                  el.getAttribute("tabindex")
                );
              el.setAttribute("tabindex", "-1");
            } else {
              if (el.hasAttribute("data-old-tabindex")) {
                el.setAttribute(
                  "tabindex",
                  el.getAttribute("data-old-tabindex")
                );
                el.removeAttribute("data-old-tabindex");
              } else {
                el.removeAttribute("tabindex");
              }
            }
          });
        }

        function openMenu(e) {
          e.preventDefault();
          overlay.classList.remove("overlay-hidden");
          overlay.classList.add("overlay-visible");
          overlay.setAttribute("aria-hidden", "false");
          revolver.setAttribute("aria-expanded", "true");
          if (pageMain) pageMain.setAttribute("aria-hidden", "true");
          setInert(true);
          if (closeBtn) closeBtn.focus();
        }

        function closeMenu() {
          overlay.classList.remove("overlay-visible");
          overlay.classList.add("overlay-hidden");
          overlay.setAttribute("aria-hidden", "true");
          revolver.setAttribute("aria-expanded", "false");
          if (pageMain) pageMain.removeAttribute("aria-hidden");
          setInert(false);
          if (revolver) revolver.focus();
        }

        if (revolver) revolver.addEventListener("click", openMenu);
        if (closeBtn) closeBtn.addEventListener("click", closeMenu);
        if (backdrop) {
          backdrop.addEventListener("click", function (e) {
            if (e.target === backdrop) {
              closeMenu();
            }
          });
        }
        document.addEventListener("keydown", function (ev) {
          if (
            ev.key === "Escape" &&
            overlay.classList.contains("overlay-visible")
          ) {
            closeMenu();
          }
        });
      })();
    </script>
  </body>
</html>
