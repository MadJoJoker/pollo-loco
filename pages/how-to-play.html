<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How to Play</title>
    <link rel="stylesheet" href="/css/how-toplay.css" />
    <link rel="stylesheet" href="/css/start-screen.css" />

    <link
      rel="shortcut icon"
      href="/assets/img/10_external_img/background-dessert.jpg"
      type="image/x-icon"
    />
  </head>

      <body id="start-body">

        <div id="how-to-play-scoreboard">
          <h1>How to Play</h1>
          <div class="scoreboard-columns">
            <ul>
              <li>
                Left:
                <img src="/assets/button/arrow-left.png" alt="Left Control" />
              </li>
              <li>
                Right:
                <img src="/assets/button/arrow-right.png" alt="Right Control" />
              </li>
              <li>
                Throw:
                <img
                  src="/assets/button/bow-and-arrow-7846362_640.png"
                  alt="Throw Control"
                />
              </li>
              <li>
                Jump:
                <img
                  src="/assets/button/boot-306065_640.png"
                  alt="Jump Control"
                />
              </li>
            </ul>
            <ul>
              <li>
                Mute: <img src="/assets/button/mute.png" alt="Mute Control" />
              </li>
              <li>
                Pause:
                <img
                  src="/assets/button/cowboy-1297120_640.png"
                  alt="Pause Control"
                />
              </li>
              <li>
                Start Game:
                <img
                  src="/assets/button/hat-310509_640.png"
                  alt="Start Game Control"
                />
              </li>
              <li>
                Fullscreen:
                <img
                  src="/assets/button/btn-small.png"
                  alt="Fullscreen Control"
                />
              </li>
            </ul>
          </div>
        </div>

        <header id="start-header">
          <a onclick="location.href='pages/impressum.html'">Impressum</a>
          <nav id="start-navbar">
            <div id="main-menu-placeholder"></div>
          </nav>
          <a onclick="location.href='pages/datenschutz.html'">Datenschutz</a>
        </header>
        <script>
         fetch("/pages/main-menu.html")
        .then((response) => response.text())
        .then((html) => {
          document.getElementById("main-menu-placeholder").innerHTML = html;
          if (window.initCarousel) window.initCarousel();
        });
        </script>
        <script src="/js/main-menu-carousel.js"></script>

    </html>
  </body>
</html>
