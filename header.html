<header id="start-header">
  <button
    type="button"
    id="impressum-link"
    class="header-btn"
    onclick="window.openPage('pages/impressum.html')"
  >
    Impressum
  </button>
  <nav id="start-navbar">
    <button
      type="button"
      id="revolver-btn"
      class="header-btn"
      aria-controls="menu-overlay"
      aria-expanded="false"
      onclick="window.showPageDiv('main-menu')"
    >
      <img
        src="/assets/img/10_external_img/revolver-menu.png"
        alt="menu"
        class="nav-icon"
      />
    </button>
  </nav>
  <button
    type="button"
    id="datenschutz-link"
    class="header-btn"
    onclick="window.openPage('pages/datenschutz.html')"
  >
    Datenschutz
  </button>
</header>
